[project]
name = "ai-support-bot-evals"
version = "0.1.0"
description = "TokoKita customer care bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
